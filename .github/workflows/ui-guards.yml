name: UI Guardrails

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ui-guards:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.4"

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Biome format check
      run: bunx biome format .

    - name: Prettier Markdown format check
      run: bunx prettier --check "**/*.{md,mdx}"

    - name: Biome lint (error-level)
      run: bunx biome check --diagnostic-level=error .

    - name: ESLint
      run: bunx eslint .

    - name: Run tabs/buttons overflow linting
      run: bunx tsx scripts/lint-tabs-overflow.ts

    - name: Run long labels tab tests
      run: bunx vitest --run --reporter=verbose src/components/ui/__tests__/tabs-long-labels.test.tsx

    - name: Report success
      run: echo "✅ All UI guardrails passed!"
