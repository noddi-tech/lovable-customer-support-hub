name: Layout Library CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/components/admin/design/components/layouts/**'
      - 'src/components/admin/design/stories/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/components/admin/design/components/layouts/**'
      - 'src/components/admin/design/stories/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test -- --coverage --reporter=verbose src/components/admin/design/components/layouts/__tests__/

      - name: Coverage quality gate
        run: |
          bun run test -- --coverage --reporter=json | jq '.coverageMap | keys[] as $k | .[$k] | select(.s | map(.) | add / length < 1.0) | $k'
          if [ $? -eq 0 ]; then
            echo "❌ Coverage below 100% threshold"
            exit 1
          fi
          echo "✅ 100% test coverage achieved"

      - name: Build Storybook
        run: bun run build-storybook -- --quiet

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Build production bundle
        run: bun run build

      - name: Bundle size check
        run: |
          BUNDLE_SIZE=$(du -sh dist/ | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          if [[ ${BUNDLE_SIZE%M*} -gt 50 ]]; then
            echo "❌ Bundle size exceeds 50MB limit"
            exit 1
          fi
          echo "✅ Bundle size within limits"

  accessibility:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run build-storybook

      - name: Run accessibility tests
        run: |
          bunx http-server storybook-static -p 6006 &
          sleep 5
          bunx @storybook/test-runner --url http://localhost:6006 --accessibility
