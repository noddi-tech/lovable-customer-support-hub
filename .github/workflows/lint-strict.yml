name: Lint strict

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gate (check-only)
        run: bun run quality:gate:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Knip
        run: bun run lint:knip

      - name: dependency-cruiser
        run: bun run lint:deps

      - name: Secrets (secretlint)
        run: bun run lint:secrets

      - name: Clone detection (jscpd)
        run: bun run lint:dupes

      - name: bun audit (critical+)
        run: bun run lint:audit
        continue-on-error: true

      - name: Setup Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml
        continue-on-error: true
